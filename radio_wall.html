<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit-Wall Radio</title>
<style>
  :root { --gold: #f5c518; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #060606; color: #fff;
    font-family: Impact, "Arial Narrow", Helvetica, sans-serif;
    background-image: radial-gradient(#2a2a2a 1.5px, transparent 1.6px);
    background-size: 14px 14px;
    max-width: 460px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header { padding: 10px 12px 0; font-size: 13px; letter-spacing: 1px; color: #bbb; }
  header b { color: #fff; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; }
  .card {
    border: 2px solid var(--gold); border-radius: 10px;
    background: rgba(0,0,0,.85); padding: 8px; min-height: 150px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-size: 15px; letter-spacing: .5px; }
  .radio-tag { font-size: 11px; color: #fff; letter-spacing: 1px; }
  .num { font-size: 34px; line-height: 1; }
  .meta { font-size: 10px; color: #999; font-family: Arial, sans-serif; }
  .quote { font-size: 13px; color: #ddd; font-family: Arial, sans-serif; }
  audio { width: 100%; height: 26px; margin-top: auto; }
  #question {
    margin: 2px 12px; text-align: center; font-size: 20px;
    background: rgba(0,0,0,.7); padding: 6px; border-radius: 6px;
  }
  #askbar {
    margin-top: auto; padding: 10px 12px 14px; display: flex; gap: 8px;
    background: rgba(0,0,0,.9); position: sticky; bottom: 0;
  }
  #askbar input {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444;
    background: #111; color: #fff; font-size: 14px; font-family: Arial, sans-serif;
  }
  #askbar button {
    background: var(--gold); border: none; border-radius: 8px;
    padding: 0 16px; font-weight: bold; cursor: pointer;
  }
  #reply { padding: 0 12px 10px; font-family: Arial, sans-serif; font-size: 14px; color: #ffe27a; min-height: 20px; }
  .hint { padding: 0 12px 12px; font-family: Arial, sans-serif; font-size: 11px; color: #888; }
</style>
</head>
<body>
<header><b>PIT-WALL RADIO</b> · <span id="sess">connecting…</span></header>
<div id="grid"></div>
<div id="question">What's the best radio message so far?</div>
<div id="reply"></div>
<div id="askbar">
  <input id="q" placeholder="Hold Handy hotkey, speak, release — then Ask">
  <button id="go">Ask</button>
</div>
<div class="hint">Handy pastes speech into any field — focus this box, hold your Handy hotkey, talk, release. Voice reply uses free browser voice; F1 beep plays first.</div>

<script>
const API = 'https://api.openf1.org/v1';
const grid = document.getElementById('grid');
const sessEl = document.getElementById('sess');

async function load() {
  try {
    const [radios, drivers, sess] = await Promise.all([
      fetch(`${API}/team_radio?session_key=latest`).then(r => r.json()),
      fetch(`${API}/drivers?session_key=latest`).then(r => r.json()),
      fetch(`${API}/sessions?session_key=latest`).then(r => r.json()),
    ]);
    const s = sess[0];
    sessEl.textContent = `${s.session_name} · ${s.location} ${s.year}`;
    const dmap = {};
    drivers.forEach(d => dmap[d.driver_number] = d);
    const last6 = radios.slice(-6).reverse();
    grid.innerHTML = '';
    last6.forEach(t => {
      const d = dmap[t.driver_number] || {};
      const col = '#' + (d.team_colour || 'F5C518');
      const name = (d.broadcast_name || ('CAR ' + t.driver_number)).toUpperCase();
      const time = new Date(t.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="top">
          <span class="name" style="color:${col}">${name.split(' ').pop()} <span class="radio-tag">RADIO</span></span>
        </div>
        <div class="num" style="color:${col}">${t.driver_number}</div>
        <div class="meta">${d.team_name || ''} · ${time}</div>
        <div class="quote">“TEAM RADIO” — tap play</div>
        <audio controls preload="none" src="${t.recording_url}"></audio>`;
      grid.appendChild(el);
    });
  } catch (e) {
    sessEl.textContent = 'telemetry unavailable (offline?)';
  }
}
load();
setInterval(load, 60000);

const beep = new Audio('assets/beep.mp3');
async function ask() {
  const input = document.getElementById('q');
  const text = input.value.trim();
  if (!text) return;
  beep.play().catch(()=>{});
  const res = await fetch('/api/ask', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({text})
  }).then(r => r.json());
  document.getElementById('reply').textContent = 'Jarvis: ' + res.reply;
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(res.reply)); } catch(e) {}
  input.value = '';
}
document.getElementById('go').onclick = ask;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
